<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="form-container">

    <div class="page-header">

        <h1>
            <img src="/images/hospital-logo.png" alt="Hospital Logo" class="header-logo">
            Hospital Management System
        </h1>
        <p>Add New Patient</p>

    </div>

    <div class="form-card">

        <div class="form-grid">

            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name">
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name">
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" id="age" placeholder="Enter age">
            </div>

            <div class="input-group">
                <label>Gender</label>
                <input type="text" id="gender" placeholder="Male / Female">
            </div>

            <div class="input-group">
                <label>Phone</label>
                <input type="text" id="phone" placeholder="9876543210">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>

            <div class="input-group full-width">
                <label>Address</label>
                <input type="text" id="address" placeholder="Enter address">
            </div>

        </div>

        <div class="form-buttons">

            <button onclick="addPatient()">
                Save Patient
            </button>

            <button class="secondary-btn"
                    onclick="window.location.href='patients.html'">
                Back
            </button>

        </div>

        <p id="message" class="message"></p>

    </div>

</div>

<script src="/js/app.js"></script>

</body>

</html>
