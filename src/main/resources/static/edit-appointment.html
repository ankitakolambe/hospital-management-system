<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="form-container">

    <div class="page-header">

        <h1>🏥 Hospital Management System</h1>

        <p>Edit Appointment Details</p>

    </div>

    <div class="form-card">

        <div class="form-grid">

            <div class="input-group">
                <label>Appointment Date</label>
                <input type="date" id="appointmentDate">
            </div>

            <div class="input-group">
                <label>Appointment Time</label>
                <input type="time" id="appointmentTime">
            </div>

            <div class="input-group">
                <label>Status</label>
                <select id="status">
                    <option value="Scheduled">Scheduled</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                    <option value="Rescheduled">Rescheduled</option>
                </select>
            </div>

            <div class="input-group">
                <label>Patient ID</label>
                <input type="number" id="patientId" placeholder="Enter Patient ID">
            </div>

            <div class="input-group">
                <label>Doctor ID</label>
                <input type="number" id="doctorId" placeholder="Enter Doctor ID">
            </div>

        </div>

        <div class="form-buttons">

            <button onclick="updateAppointment()">
                Update Appointment
            </button>

            <button class="secondary-btn"
                    onclick="window.location.href='appointment.html'">
                Back
            </button>

        </div>

        <p id="message" class="message"></p>

    </div>

</div>

<script src="/js/app.js"></script>

<script>
    loadAppointmentForEdit();
</script>

</body>

</html>
