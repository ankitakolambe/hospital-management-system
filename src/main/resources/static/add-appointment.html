<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Appointment</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app-shell">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img src="/images/hospital-logo.png" alt="Hospital Logo">

            <div class="sidebar-brand-text">
                <div class="sidebar-brand-name">Hospital</div>
                <div class="sidebar-brand-sub">Management</div>
            </div>

        </div>

        <div class="pulse-rule on-dark"></div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                <span class="nav-icon">🏠</span>
                Dashboard
            </a>

            <a href="patients.html" class="nav-link">
                <span class="nav-icon">👨‍⚕️</span>
                Patients
            </a>

            <a href="doctor.html" class="nav-link">
                <span class="nav-icon">🩺</span>
                Doctors
            </a>

            <a href="appointment.html" class="nav-link active">
                <span class="nav-icon">📅</span>
                Appointments
            </a>

        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="main-inner">

            <div class="form-container">

                <div class="page-header">

                    <span class="eyebrow">Appointments</span>

                    <h1>Add Appointment</h1>

                    <p>Schedule a new appointment.</p>

                </div>

                <div class="pulse-rule"></div>

                <div class="form-card">

                    <div class="form-grid">

                        <div class="input-group">
                            <label>Appointment Date</label>
                            <input type="date" id="appointmentDate">
                        </div>

                        <div class="input-group">
                            <label>Appointment Time</label>
                            <input type="time" id="appointmentTime">
                        </div>

                        <div class="input-group">
                            <label>Status</label>

                            <select id="status">
                                <option value="">-- Select Status --</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Pending">Pending</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                                <option value="Rescheduled">Rescheduled</option>
                            </select>

                        </div>

                        <div class="input-group">
                            <label>Patient ID</label>
                            <input type="number" id="patientId" placeholder="Enter Patient ID">
                        </div>

                        <div class="input-group">
                            <label>Doctor ID</label>
                            <input type="number" id="doctorId" placeholder="Enter Doctor ID">
                        </div>

                    </div>

                    <div class="form-buttons">

                        <button onclick="addAppointment()">
                            Save Appointment
                        </button>

                        <button class="secondary-btn"
                                onclick="window.location.href='appointment.html'">
                            Back
                        </button>

                    </div>

                    <p id="message" class="message"></p>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="/js/app.js"></script>

</body>
</html>
