<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Doctor</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app-shell">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img src="/images/hospital-logo.png" alt="Hospital Logo">

            <div class="sidebar-brand-text">
                <div class="sidebar-brand-name">Hospital</div>
                <div class="sidebar-brand-sub">Management</div>
            </div>

        </div>

        <div class="pulse-rule on-dark"></div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                <span class="nav-icon">🏠</span>
                Dashboard
            </a>

            <a href="patients.html" class="nav-link">
                <span class="nav-icon">👨‍⚕️</span>
                Patients
            </a>

            <a href="doctor.html" class="nav-link active">
                <span class="nav-icon">🩺</span>
                Doctors
            </a>

            <a href="appointment.html" class="nav-link">
                <span class="nav-icon">📅</span>
                Appointments
            </a>

        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="main-inner">

            <div class="form-container">

                <div class="page-header">

                    <span class="eyebrow">Doctors</span>

                    <h1>Add Doctor</h1>

                    <p>Register a new doctor in the hospital.</p>

                </div>

                <div class="pulse-rule"></div>

                <div class="form-card">

                    <div class="form-grid">

                        <div class="input-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" placeholder="Enter first name">
                        </div>

                        <div class="input-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" placeholder="Enter last name">
                        </div>

                        <div class="input-group">
                            <label>Specialization</label>
                            <input type="text" id="specialization" placeholder="Enter specialization">
                        </div>

                        <div class="input-group">
                            <label>Experience (Years)</label>
                            <input type="number" id="experience" placeholder="Enter experience">
                        </div>

                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="Enter email">
                        </div>

                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" id="phone" placeholder="Enter phone number">
                        </div>

                    </div>

                    <div class="form-buttons">

                        <button onclick="addDoctor()">
                            Save Doctor
                        </button>

                        <button class="secondary-btn"
                                onclick="window.location.href='doctor.html'">
                            Back
                        </button>

                    </div>

                    <p id="message" class="message"></p>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="/js/app.js"></script>

</body>
</html>
