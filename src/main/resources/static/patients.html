<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Management</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app-shell">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img src="/images/hospital-logo.png" alt="Hospital Logo">

            <div class="sidebar-brand-text">
                <div class="sidebar-brand-name">Hospital</div>
                <div class="sidebar-brand-sub">Management</div>
            </div>

        </div>

        <div class="pulse-rule on-dark"></div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                <span class="nav-icon">🏠</span>
                Dashboard
            </a>

            <a href="patients.html" class="nav-link active">
                <span class="nav-icon">👨‍⚕️</span>
                Patients
            </a>

            <a href="doctor.html" class="nav-link">
                <span class="nav-icon">🩺</span>
                Doctors
            </a>

            <a href="appointment.html" class="nav-link">
                <span class="nav-icon">📅</span>
                Appointments
            </a>

        </nav>

        <div class="sidebar-footer">

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </aside>

    <!-- ================= Main Content ================= -->

    <main class="main-content">

        <div class="main-inner">

            <div class="table-container">

                <!-- Header -->

                <div class="page-header">

                    <span class="eyebrow">
                        Patients
                    </span>

                    <h1>Patient Management</h1>

                    <p>
                        View, add, edit and manage patient records.
                    </p>

                </div>

                <div class="pulse-rule"></div>

                <!-- Table Card -->

                <div class="table-card">

                    <div class="table-top">

                        <h2>Patient List</h2>

                        <button onclick="window.location.href='add-patient.html'">
                            + Add Patient
                        </button>

                    </div>

                    <table id="patientTable">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody>

                        <!-- Loaded dynamically -->

                        </tbody>

                    </table>

                    <div class="table-footer">

                        <button
                                class="secondary-btn"
                                onclick="window.location.href='dashboard.html'">

                            ← Back to Dashboard

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- JavaScript -->
<script src="/js/app.js"></script>

<script>
    loadPatients();
</script>

</body>

</html>
